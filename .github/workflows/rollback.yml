name: Rollback

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rollback先のgit ref（タグ名 or コミットSHA）"
        required: true
        type: string
      target:
        description: "再デプロイ対象"
        required: true
        type: choice
        options:
          - both
          - pages
          - worker
        default: both

permissions:
  contents: read

concurrency:
  group: rollback-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Build apps/web (static export)
        if: ${{ inputs.target == 'both' || inputs.target == 'pages' }}
        run: nix develop --command bun run --filter web build

      - name: Rollback Cloudflare Pages
        if: ${{ inputs.target == 'both' || inputs.target == 'pages' }}
        run: nix develop --command wrangler pages deploy apps/web/out --project-name=hitokoto-shindan-web --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Rollback Cloudflare Worker
        if: ${{ inputs.target == 'both' || inputs.target == 'worker' }}
        run: nix develop --command bash -c "cd apps/api && wrangler deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          echo "### Rollback complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${{ inputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- target: \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
